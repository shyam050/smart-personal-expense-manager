# Server
server.port=${PORT:8080}

# Database - DATABASE_URL is parsed into JDBC format by DataSourceConfig.java
# (Render provides postgres://user:pass@host:port/dbname, Spring needs jdbc:postgresql://...)
app.database-url=${DATABASE_URL}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS - your deployed frontend URL
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Logging
logging.level.com.expense=INFO
logging.level.org.springframework.security=INFO
